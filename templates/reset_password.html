{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GophishFR - Security Awareness Simulation Platform">
    <meta name="author" content="Vesperis Group">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <title>GophishFR - {{ .Title }}</title>

    <link href="/css/dist/gophish.css" rel="stylesheet">
</head>

<body data-bs-no-jquery>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-gophishfr fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img class="navbar-logo" src="/images/logo_inv_small.png" alt="GophishFR" />
                &nbsp;GophishFR
            </a>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <div class="btn-group" id="navbar-dropdown">
                            <a class="btn btn-primary" href="/logout"><i class="fa fa-user"></i> {{.User.Username}}</a>
                            <a class="btn btn-primary" href="/logout">
                                <i class="fa fa-sign-out"></i>
                            </a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <form class="form-signin" action="" method="POST">
            <img id="logo" src="/images/logo_purple.png" alt="GophishFR logo" />
            <h2 class="form-signin-heading">Reset Your Password</h2>
            {{template "flashes" .Flashes}}
            <label for="password" class="visually-hidden">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password"
                autocomplete="off" minlength="8" required autofocus>
            <div class="d-none" id="password-strength-container">
                <div class="progress" id="password-strength">
                    <div id="password-strength-bar" class="progress-bar" role="progressbar" aria-valuenow="0"
                        aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span id="password-strength-description"></span>
            </div>
            <label for="confirm_password" class="visually-hidden">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm Password"
                autocomplete="off" minlength="8" required>
            <input type="hidden" name="csrf_token" value="{{.Token}}" />
            <br />
            <button class="btn btn-lg btn-primary w-100" type="submit">Save Password</button>
        </form>
    </div>
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/app/passwords.min.js"></script>
    <script src="/js/dist/vendor.min.js"></script>
</body>

</html>
{{ end }}
