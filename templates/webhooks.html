{{define "body"}}
<div class="col-sm-9 offset-sm-3 col-md-10 offset-md-2 main">
    <h1 class="page-header">
        {{.Title}}
    </h1>
    <div id="flashes" class="row"></div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-bs-toggle="modal"
            data-webhook-id="-1" data-bs-target="#modal">
            <i class="fa fa-plus"></i> New Webhook</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="webhookTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th class="col-md-2 no-sort">Title</th>
                    <th class="col-md-2 no-sort">Url</th>
                    <th class="col-md-2 no-">Is active</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="webhookModalLabel"
    aria-modal="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="webhookModalLabel">Add or Edit Webhook</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="form-label" for="title">Name:</label>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Name" id="name" required autofocus />
                </div>

                <label class="form-label" for="url">URL:</label>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="https://example.com/webhook1" id="url" required />
                </div>

                <label class="form-label" for="secret">Secret:</label>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Leave blank to keep the current secret unchanged" id="secret" autocomplete="off" />
                    <div class="form-text">
                        The stored secret is write-only and is never shown here. Leave this
                        blank to keep it unchanged, or type a new value to replace it.
                    </div>
                </div>

                <div class="checkbox checkbox-primary" id="clear_secret_row" style="display:none;">
                    <input type="checkbox" id="clear_secret" value="true" />
                    <label for="clear_secret">Remove the existing secret <i class="fa fa-question-circle"
                            data-bs-toggle="tooltip" data-bs-placement="right"
                            title="Deliberately deletes this webhook's authentication secret. Only takes effect when the field above is left blank."></i>
                    </label>
                </div>

                <div class="checkbox checkbox-primary">
                    <input type="checkbox" id="is_active" value="true" />
                    <label for="is_active">Is active <i class="fa fa-question-circle"
                            data-bs-toggle="tooltip" data-bs-placement="right"
                            title="Data is sent only to the active webhooks"></i>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save changes</button>
            </div>
        </div>
    </div>
</div>


{{end}} {{define "scripts"}}
<script src="/js/dist/app/webhooks.min.js"></script>
{{end}}
