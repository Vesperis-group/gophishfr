name: CI

# Least privilege by default. Individual jobs elevate only if they must.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on pull requests, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------------------
  # Workflows are executable, secret-adjacent code. Lint them like source.
  # --------------------------------------------------------------------------
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single source of truth for the toolchain, here as
          # everywhere else in this pipeline.
          go-version-file: go.mod
          check-latest: true

      # go install verifies the module against the Go checksum database, so the
      # pinned version is tamper-evident.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: actionlint -color

      - name: Install zizmor
        run: pipx install zizmor==1.29.0

      # Fails on any finding at or above "low", so an unpinned action, an
      # over-broad permission or a template injection cannot reach main.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/workflows/

      # actionlint and zizmor verify that actions are pinned to a SHA, but not
      # that the SHA is the version the trailing comment claims. This closes
      # that gap. See scripts/verify-action-pins.sh.
      - name: Verify action pins match their claimed versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-action-pins.sh

  # --------------------------------------------------------------------------
  # Go gates: one job per independent control, so a failure is readable.
  # --------------------------------------------------------------------------
  go-format:
    name: Go format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "${unformatted}"
            gofmt -d .
            exit 1
          fi
          echo "gofmt: clean"

  go-vet:
    name: Go vet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

  go-build:
    name: Go build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # No `go get` here, unlike the upstream workflow: dependencies come from
      # the committed go.mod/go.sum only, so CI can never silently resolve a
      # different version than the one that was reviewed.
      - name: Verify module checksums
        run: go mod verify

      - name: Build
        run: go build ./...

  go-test:
    name: Go test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "Total coverage: ${total}"
          echo "Total coverage: ${total}" >> "${GITHUB_STEP_SUMMARY}"

  go-race:
    name: Go test (race)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # GophishFR is a concurrent mail sender with background workers. Data
      # races here are real bugs, not theoretical ones.
      - name: Test with race detector
        run: go test -race ./...
  # --------------------------------------------------------------------------
  # Single aggregating gate.
  #
  # Branch protection references status checks by name. Naming the matrix legs
  # directly ("Go build (1.21)", ...) couples the ruleset to the build matrix:
  # the day the matrix changes, the required contexts stop reporting and main
  # becomes permanently unmergeable, with no signal explaining why.
  #
  # This job is the only required context. The matrix can then evolve freely,
  # and adding a new gate to the pipeline is a one-line change to `needs`
  # instead of an out-of-band ruleset edit that is easy to forget.
  # --------------------------------------------------------------------------
  ci-success:
    name: CI success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Must run even when a dependency failed, otherwise the required check
    # would simply never report and the PR would hang instead of failing.
    if: always()
    needs:
      - workflow-lint
      - go-format
      - go-vet
      - go-build
      - go-test
      - go-race
    steps:
      # "not failed" is not the same as "succeeded": a skipped or cancelled job
      # must not be able to pass as a green gate.
      - name: Require every gate to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required CI job did not succeed (${result})."
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
