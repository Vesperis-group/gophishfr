    url: https://github.com/gophish/gophish/issues
    about: For bugs and ideas that concern unmodified upstream Gophish rather than GophishFR.
  - name: Gophish documentation
    url: https://getgophish.com/documentation/
    about: Usage questions are usually answered by the upstream documentation.
